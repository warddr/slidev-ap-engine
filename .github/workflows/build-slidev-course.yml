name: Build and deploy Slidev AP course

# Reusable workflow: een vakrepo roept dit op (zie examples/course-repo/
# .github/workflows/deploy.yml). Bouwt alle decks + PDF's met deze engine en
# publiceert het resultaat op GitHub Pages van de vakrepo.

on:
  workflow_call:
    inputs:
      engine-repository:
        description: Repository containing this engine.
        required: false
        type: string
        default: warddr/slidev-ap-engine
      engine-ref:
        description: Branch, tag, or commit of the engine repository.
        required: false
        type: string
        default: main
      base-path:
        description: GitHub Pages base path. Leave empty to use /<repo-name>/.
        required: false
        type: string
        default: ""
      node-version:
        description: Node.js version.
        required: false
        type: string
        default: "24"
      skip-export:
        description: Skip PDF export, useful for debugging builds.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course repository
        uses: actions/checkout@v7
        with:
          path: course

      - name: Checkout Slidev AP engine
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.engine-repository }}
          ref: ${{ inputs.engine-ref }}
          path: engine

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: engine/package-lock.json

      # npm ci installeert exact de versies uit package-lock.json. Met
      # `npm install` kwam elke run iets nieuwers binnen, en zo brak de build
      # in oktober 2026 op magic-string 1.4.3 zonder dat er iets veranderd was.
      - name: Install dependencies
        working-directory: engine
        run: npm ci

      - name: Install Chromium for Slidev export
        working-directory: engine
        run: npx playwright install --with-deps chromium

      - name: Compute base path
        id: base
        shell: bash
        env:
          BASE_INPUT: ${{ inputs.base-path }}
        run: |
          if [ -n "$BASE_INPUT" ]; then
            BASE="$BASE_INPUT"
          else
            BASE="/${GITHUB_REPOSITORY#*/}/"
          fi
          [[ "$BASE" == /* ]] || BASE="/${BASE}"
          [[ "$BASE" == */ ]] || BASE="${BASE}/"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Build course
        working-directory: engine
        env:
          BASE: ${{ steps.base.outputs.base }}
          SKIP_EXPORT: ${{ inputs.skip-export }}
        run: |
          EXTRA=""
          if [ "$SKIP_EXPORT" = "true" ]; then EXTRA="--skip-export"; fi
          node scripts/build-course.mjs --course ../course --out ../site --base "$BASE" $EXTRA

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
